name: Gradle Test

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: [ "dev"]

permissions:
  contents: read

jobs:
  build:
    name : Gradle Build Test
    runs-on: ubuntu-latest

    steps:
      - name: 서브모듈 포함 레포지토리 체크아웃
        uses: actions/checkout@v3

      - name: JDK 설치
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: 테스트 진행
        run: ./gradlew test -Dspring.profiles.active=test
