name: CI Pipeline

on:
  pull_request:
    branches:
      - dev
    types:
      - closed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 서브모듈 포함 레포지토리 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GH_ATK }}

      - name: JDK 설치
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: 테스트 진행
        run: ./gradlew test -Dspring.profiles.active=test

      - name: 운영서버 테스트 없이 빌드
        run: ./gradlew clean build -Dspring.profiles.active=prod -x test

      # - name: Run Tests
      #   run: ./gradlew test