name: CI/CD Pipeline with Ansible

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  test:
    name: Gradle Build Test
    runs-on: ubuntu-latest

    steps:
      - name: 서브모듈 포함 레포지토리 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GH_ATK }}

      - name: JDK 설치
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: Gradle 캐시 삭제
        run: ./gradlew clean --no-build-cache

      # - name: 테스트 진행
      #   run: ./gradlew test -Dspring.profiles.active=test

  deploy:
    name: Deploy Pipeline
    runs-on: ubuntu-latest
    needs: test
    if: ${{ success()}}

    steps:
      - name: 서브모듈 포함 레포지토리 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GH_ATK }}

      - name: JDK 설치
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: 운영서버 테스트 없이 빌드
        run: ./gradlew clean build -Dspring.profiles.active=prod -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: 도커 허브 로그인
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: 도커 이미지 빌드 후 푸시
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile-prod
          push: true
          tags: |
            jaew0n/thiscoding:latest

      - name: 앤서블 설치
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 현재 디렉토리 구조 출력
        working-directory: ansible
        run: ls -R ./roles

      - name: 앤서블로 배포 실행
        working-directory: ansible
        run: |
          ansible-playbook playbooks/app-server.yml
