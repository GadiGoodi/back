inventory = inventory.ini         # 서버 인벤토리 파일
remote_user = ubuntu              # 원격 서버 사용자
private_key_file = ~/.ssh/your_aws_key.pem  # AWS SSH 키
host_key_checking = False         # 호스트 키 확인 비활성화
retry_files_enabled = False       # 재시도 파일 생성 방지
roles_path = roles                # 역할(roles) 디렉토리
timeout = 30                      # SSH 연결 시간 초과 설정